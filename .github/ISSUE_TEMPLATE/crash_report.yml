name: Crash report
description: A program crashed, or wrote a crash or fatal report.
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach or paste game files, extracted game data, keys (prod.keys, title.keys) or dumps. Screenshots of a bug in a running build are fine.

        Bugs that only show up in Metroid Prime Remastered gameplay usually belong in the game repo: https://github.com/drakolordx7/MetroidPrimeRemasteredRecomp/issues

  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or release tag.
      placeholder: e.g. 1a2b3c4 or v0.3.0
    validations:
      required: false

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: false

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: e.g. RTX 4070, driver 566.36
    validations:
      required: false

  - type: input
    id: program
    attributes:
      label: What program was running
      description: The game or a test, and its name if you know it.
      placeholder: e.g. the game, or tests/runtime_loader
    validations:
      required: false

  - type: textarea
    id: crash_report
    attributes:
      label: Crash report
      description: Paste the contents of the <exe name>_crash.txt or _fatal.txt file written next to the executable.
      render: text
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the last 200 lines of nxrt.log.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: What was happening
      description: What you were doing when it crashed.
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen
      options:
        - Once
        - Sometimes
        - Every time
        - Not sure
    validations:
      required: false
