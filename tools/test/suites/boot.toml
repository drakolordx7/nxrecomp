# Suite of what runs today. Run: tools\.venv\Scripts\python tools\test\run_suite.py tools\test\suites\boot.toml [--exe path\to\mpr.exe]
[defaults]
exe = "../../../game-build/build/release/mpr.exe"
cwd = "../../../work/run"
timeout = 120
deterministic = true
regions = "../regions.tsv"
args = ["--max-seconds", "100"]
out_root = "../../../work/suite_out"
env = { NXRT_TEST_FRAME_SOURCE = "svc:4", NXRT_TEST_HASH_REGIONS = "module:main,module:sdk,module:rtld" }

[[run]]
name = "bringup_det"
script = "../scripts/bringup.nxs"
repeat = 2                       # two runs, the final hash of every frame must be identical
tags = ["boot", "determinism"]

[[run]]
name = "negative_script_fails"
script = "../scripts/bringup_fail.nxs"
expect_exit = 1
tags = ["boot"]
