# Play-mode oracles (S8, runtime/docs/S8.md). Run:
#   tools\.venv\Scripts\python tools\test\run_suite.py tools\test\suites\play.toml [--exe path\to\mpr.exe]
#   tools\.venv\Scripts\python tools\test\play_check.py suite work\suite_out_play        (the cross-run comparisons the table cannot express)
# Title-screen runs are headless; the window runs open a real window on the desktop for about a minute each.
[defaults]
exe = "../../../game-build/build/release/mpr.exe"
cwd = "../../../work/run"
timeout = 240
deterministic = true
regions = "../regions.tsv"
args = ["--max-seconds", "230"]
out_root = "../../../work/suite_out_play"
env = { NXRT_BOOT_GFX = "headless", NXRT_FS_ROMFS = "../../game/romfs", NXRT_FS_SAVE_DIR = "save" }

[[run]]
name = "title_idle"
script = "../scripts/play_title_idle.nxs"
tags = ["title", "input"]

[[run]]
name = "title_pad"
script = "../scripts/play_title_pad.nxs"
tags = ["title", "input"]

[[run]]
name = "title_key_return"
script = "../scripts/play_title_key.nxs"
tags = ["title", "input"]

[[run]]
name = "title_key_space"
script = "../scripts/play_title_space.nxs"
tags = ["title", "input"]

# window: open, resize, borderless / windowed, Alt+Enter, close
[[run]]
name = "window_lifecycle"
script = "../scripts/play_idle.nxs"
deterministic = true
env = { NXRT_BOOT_GFX = "window", NXRT_FS_ROMFS = "../../game/romfs", NXRT_FS_SAVE_DIR = "save", NXRT_PLAY_SELFTEST = "wait:150,expect_mode:windowed,size:960x540,expect_size:960x540,mode:borderless,expect_mode:borderless,mode:windowed,expect_mode:windowed,altenter,expect_mode:borderless,altenter,expect_mode:windowed,size:1280x720,expect_size:1280x720,wait:20,close" }
tags = ["window"]

# frame limiter in window mode
[[run]]
name = "window_fps_limiter"
script = "../scripts/play_idle.nxs"
deterministic = true
timeout = 300
env = { NXRT_BOOT_GFX = "window", NXRT_FS_ROMFS = "../../game/romfs", NXRT_FS_SAVE_DIR = "save", NXRT_PLAY_SELFTEST = "wait:1500,cap:30,measure:8,expect_late:0.5,cap:60,measure:8,expect_late:0.5,cap:120,measure:6,cap:144,measure:6,pass" }
tags = ["window", "pacing"]

# settings: vsync, frame cap, window mode and mouse sensitivity changed the way the settings page does it, saved to controls.ini
[[run]]
name = "window_settings"
script = "../scripts/play_idle.nxs"
deterministic = false
env = { NXRT_BOOT_GFX = "window", NXRT_FS_ROMFS = "../../game/romfs", NXRT_FS_SAVE_DIR = "save", NXRT_PLAY_CONTROLS = "controls_selftest.ini", NXRT_PLAY_SELFTEST = "wait:1000,set:vsync=1,expect_present:fifo,expect_ini:vsync = 1,set:vsync=0,expect_present:immediate,set:fps_cap=90,expect_cap:90,expect_ini:fps_cap = 90,set:window_mode=borderless,expect_mode:borderless,set:window_mode=windowed,expect_mode:windowed,set:yaw_source=3,set:invert_y=1,expect_ini:invert_y = 1,pass" }
tags = ["window", "settings"]

# the F1 overlay with the settings page
[[run]]
name = "window_overlay"
script = "../scripts/play_overlay.nxs"
deterministic = false
env = { NXRT_BOOT_GFX = "window", NXRT_FS_ROMFS = "../../game/romfs", NXRT_FS_SAVE_DIR = "save", NXRT_PLAY_SELFTEST = "wait:1000,key:F1:down,key:F1:up,wait:60" }
tags = ["window", "overlay"]
